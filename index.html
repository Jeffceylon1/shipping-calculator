<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5eff">
<title>Shipping Calculator: Canada → Sri Lanka</title>
<meta name="description" content="Instant shipping cost from Canada to Sri Lanka in CAD or LKR. Print, save or send your quote.">
<meta property="og:title" content="Shipping Calculator: Canada → Sri Lanka">
<meta property="og:description" content="Instant shipping cost in CAD or LKR. Print, save or send your quote.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --muted:#6b7385; --accent:#1f5eff; --accent-soft:#f0f4ff; --line:#e3e6ec; --ok:#067647; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
         padding:max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }
  svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 24px; box-shadow:0 8px 30px rgba(29,36,51,.06); }
  .pane-result { min-width:0; }
  h1 { margin:0; font-size:22px; }
  .sub { margin:2px 0 22px; color:var(--muted); font-size:14px; }

  label.field { display:block; font-size:14px; font-weight:600; margin-bottom:16px; }
  label.field[hidden] { display:none; }
  label.field > span { display:block; margin-bottom:6px; }
  input, select { font:inherit; font-size:20px; color:var(--ink); padding:12px 14px; border:1px solid var(--line); border-radius:10px; width:100%; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }

  .stepper { display:flex; gap:8px; }
  .stepper input { text-align:center; font-size:24px; font-weight:600; }
  .stepper button { width:56px; flex:none; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); cursor:pointer; display:grid; place-items:center; }
  .stepper button:active { background:var(--accent-soft); }

  .result { margin-top:4px; padding:20px 16px; border-radius:14px; background:var(--accent-soft); text-align:center; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; margin-bottom:12px; }
  .seg[hidden] { display:none; }
  .seg button { font:inherit; font-weight:600; border:none; background:none; padding:8px 24px; cursor:pointer; color:var(--ink); }
  .seg button.on { background:var(--accent); color:#fff; }
  .label { font-size:14px; color:var(--muted); }
  .total { font-size:42px; line-height:1.15; font-weight:700; margin:4px 0; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .detail { font-size:14px; color:var(--muted); }
  .detail.free { color:var(--ok); font-weight:600; }
  .fx { margin-top:10px; font-size:12px; color:var(--muted); }

  .actions { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:16px; }
  .actions button { font:inherit; font-size:13px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px;
                    border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); cursor:pointer; }
  .actions button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .actions button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .actions button.primary:hover:not(:disabled) { color:#fff; filter:brightness(1.08); }
  .actions button:disabled { opacity:.4; cursor:not-allowed; }

  .note { margin:16px 0 0; font-size:12px; color:var(--muted); text-align:center; }
  .contact { margin:6px 0 0; font-size:13px; font-weight:600; text-align:center; }
  .contact:empty, .note:empty { display:none; }

  dialog { border:none; padding:0; border-radius:18px; width:min(440px, calc(100vw - 24px)); max-height:calc(100dvh - 24px); overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(15,20,30,.45); }
  @media (max-width: 520px) {
    dialog { margin:auto auto 0; width:100vw; max-width:100vw; border-radius:18px 18px 0 0; padding-bottom:env(safe-area-inset-bottom); }
  }
  .sheet { padding:20px; }
  .sheet header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .sheet h2 { margin:0; font-size:18px; }
  .sheet p { margin:0 0 16px; font-size:13px; color:var(--muted); }
  .icon-btn { border:none; background:none; padding:6px; cursor:pointer; color:var(--muted); border-radius:8px; }
  .share-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px 8px; }
  .share-grid button[hidden] { display:none; }
  .share-grid button { font:inherit; font-size:12px; border:none; background:none; cursor:pointer; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:6px; padding:0; }
  .share-grid i { width:54px; height:54px; border-radius:16px; display:grid; place-items:center; color:#fff; }
  .share-grid i svg { width:26px; height:26px; }

  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0; pointer-events:none; transition:.2s;
           background:#1d2433; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; z-index:10; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }

  .admin-link { border:none; background:none; color:var(--muted); font:inherit; font-size:13px; display:inline-flex; align-items:center; gap:6px; cursor:pointer; min-height:40px; padding:8px 14px; border-radius:10px; }
  .admin-link:hover { color:var(--ink); background:#e9ecf1; }
  .admin-link svg { width:15px; height:15px; }
  .login-form input { font-size:18px; text-align:center; letter-spacing:.08em; }
  .login-form .error { min-height:20px; margin:8px 0 0; font-size:13px; color:#b42318; text-align:center; }
  .login-form button[type="submit"] { width:100%; margin-top:8px; font:inherit; font-weight:600; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  .login-form button[type="submit"]:disabled { opacity:.6; cursor:wait; }

  /* Small phones */
  @media (max-width: 360px) {
    .card { padding:22px 16px; border-radius:16px; }
    .stepper button { width:48px; }
    .seg button { padding:8px 18px; }
    .actions { gap:6px; }
    .actions button { font-size:12px; padding:10px 2px; }
    .share-grid i { width:48px; height:48px; border-radius:14px; }
  }
  /* Landscape phones and short windows: inputs | result side by side */
  @media (min-width: 700px) and (max-height: 560px) {
    body { justify-content:flex-start; }
    .card { max-width:880px; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.15fr); gap:0 28px; align-items:start; padding:22px 24px; }
    .sub { margin-bottom:16px; }
    .result { margin-top:0; padding:14px 16px; }
    .seg { margin-bottom:6px; }
    .actions { margin-top:12px; }
  }
  /* Large screens: slightly bigger card */
  @media (min-width: 1600px) and (min-height: 900px) {
    .card { max-width:500px; padding:34px 30px; }
  }

  #printImg { display:none; }
  @media print {
    @page { margin:12mm; }
    body { display:block; padding:0; background:#fff; min-height:0; }
    body > *:not(#printImg) { display:none !important; }
    #printImg { display:block; width:100%; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="pane-input">
  <h1 id="title">Shipping cost</h1>
  <p class="sub" id="route">Canada → Sri Lanka</p>

  <label class="field"><span>Parcel weight (kg)</span>
    <div class="stepper">
      <button type="button" id="minus" aria-label="Decrease weight"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <input id="weight" type="number" min="0" step="0.1" inputmode="decimal" placeholder="0.0" autofocus>
      <button type="button" id="plus" aria-label="Increase weight"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
  </label>
  <label class="field" id="zoneWrap" hidden><span>Destination</span>
    <select id="zone"></select>
  </label>
  <label class="field" id="orderWrap" hidden><span>Order value (<span id="orderCur">CAD</span>)</span>
    <input id="orderValue" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
  </label>
  </div>

  <div class="pane-result">
  <section class="result" aria-live="polite">
    <div class="seg" id="curToggle" role="group" aria-label="Currency">
      <button type="button" data-cur="base">CAD</button>
      <button type="button" data-cur="LKR">LKR</button>
    </div>
    <div class="label" id="totalLabel">Total shipping</div>
    <div class="total" id="total">-</div>
    <div class="detail" id="detail">Enter the parcel weight</div>
    <div class="fx" id="fxInfo"></div>
  </section>

  <div class="actions">
    <button type="button" id="printBtn" disabled>
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print</button>
    <button type="button" id="imageBtn" disabled>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Image</button>
    <button type="button" id="pdfBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>PDF</button>
    <button type="button" id="shareBtn" class="primary" disabled>
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Send</button>
  </div>

  <p class="note" id="note"></p>
  <p class="contact" id="contact"></p>
  </div>
</main>
<button type="button" class="admin-link" id="adminBtn">
  <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Admin
</button>

<dialog id="loginSheet" aria-labelledby="loginTitle">
  <form class="sheet login-form" id="loginForm">
    <header>
      <h2 id="loginTitle">Admin login</h2>
      <button type="button" class="icon-btn" id="loginClose" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </header>
    <p>Enter the admin passcode to manage rates.</p>
    <input id="passcode" type="password" autocomplete="current-password" placeholder="Passcode" required>
    <div class="error" id="loginError" role="alert"></div>
    <button type="submit" id="loginSubmit">Log in</button>
  </form>
</dialog>

<dialog id="shareSheet" aria-labelledby="shareTitle">
  <div class="sheet">
    <header>
      <h2 id="shareTitle">Send quote</h2>
      <button type="button" class="icon-btn" id="shareClose" aria-label="Close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </header>
    <p>Choose an app to send this quote.</p>
    <div class="share-grid">
      <button type="button" data-share="whatsapp"><i style="background:#25D366"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></i>WhatsApp</button>
      <button type="button" data-share="viber"><i style="background:#7360F2"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></i>Viber</button>
      <button type="button" data-share="sms"><i style="background:#34C759"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></i>Messages</button>
      <button type="button" data-share="email"><i style="background:#1f5eff"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></i>Email</button>
      <button type="button" data-share="telegram"><i style="background:#229ED9"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></i>Telegram</button>
      <button type="button" data-share="copyText"><i style="background:#475467"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></i>Copy text</button>
      <button type="button" data-share="copyImage"><i style="background:#475467"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></i>Copy image</button>
      <button type="button" data-share="native"><i style="background:#1d2433"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></i>More apps</button>
    </div>
  </div>
</dialog>

<img id="printImg" alt="Shipping quote">
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="quote.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = "shippingAdminToken"; // shared with admin.html
  const ROUTE = "Canada → Sri Lanka";

  // Admin login (works even if rates fail to load)
  const loginSheet = $("loginSheet");
  const openLogin = () => {
    $("loginError").textContent = "";
    $("passcode").value = "";
    loginSheet.showModal();
    $("passcode").focus();
  };
  $("adminBtn").addEventListener("click", async () => {
    try {
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        const res = await fetch(`${SHIPPING_API}/session`, { cache: "no-store", headers: { "x-admin-token": token } });
        if ((await res.json()).authed) { location.href = "admin.html"; return; }
      }
    } catch {}
    openLogin();
  });
  $("loginClose").addEventListener("click", () => loginSheet.close());
  loginSheet.addEventListener("click", (e) => { if (e.target === loginSheet) loginSheet.close(); });
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submit = $("loginSubmit");
    submit.disabled = true;
    submit.textContent = "Checking…";
    try {
      const res = await fetch(`${SHIPPING_API}/session`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ passcode: $("passcode").value }),
      });
      if (res.ok) {
        localStorage.setItem(TOKEN_KEY, (await res.json()).token);
        location.href = "admin.html";
        return;
      }
      $("loginError").textContent = res.status === 401 ? "Wrong passcode. Please try again." : "Login failed. Please try again.";
      $("passcode").select();
    } catch {
      $("loginError").textContent = "No connection. Please try again.";
    } finally {
      submit.disabled = false;
      submit.textContent = "Log in";
    }
  });
  if (new URLSearchParams(location.search).has("login")) {
    history.replaceState(null, "", location.pathname);
    openLogin();
  }

  // Rates
  $("detail").textContent = "Loading rates…";
  let rates;
  try {
    const res = await fetch(`${SHIPPING_API}/rates`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    rates = await res.json();
  } catch {
    $("detail").textContent = "Shipping rates are unavailable. Please try again later.";
    return;
  }
  const { num, round2, calculate, formatMoney, createCurrencyView } = Shipping;
  const view = createCurrencyView({ toggle: $("curToggle"), getBase: () => rates.currency, onChange: render });
  const pageUrl = /^https?:/.test(location.protocol) ? location.href.split("#")[0] : "";

  // Static page setup from published rates
  if (rates.businessName) { $("title").textContent = rates.businessName; document.title = `${rates.businessName}: Shipping to Sri Lanka`; }
  $("route").textContent = rates.businessName ? `Shipping cost · ${ROUTE}` : ROUTE;
  $("note").textContent = rates.quoteNote || "";
  $("contact").textContent = rates.contact || "";
  if (rates.zones.length > 1) {
    $("zoneWrap").hidden = false;
    rates.zones.forEach((z, i) => $("zone").add(new Option(z.name || `Zone ${i + 1}`, i)));
  }
  $("orderWrap").hidden = !(rates.freeOver > 0);
  $("orderCur").textContent = rates.currency;
  const totalLabel = rates.taxPct > 0 ? "Total shipping (incl. tax)" : "Total shipping";
  $("totalLabel").textContent = totalLabel;

  const kgText = (n) => `${round2(n)} kg`;
  const input = () => ({
    weight: num($("weight").value), qty: 1,
    zoneIndex: Number($("zone").value) || 0, orderValue: $("orderValue").value,
  });

  /** Shrink the total until it fits on one line (long LKR amounts on small screens). */
  function fitTotal() {
    const el = $("total");
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 18) {
      size -= 1;
      el.style.fontSize = `${size}px`;
    }
  }

  function render() {
    $("fxInfo").textContent = view.sync();
    const inp = input();
    const ready = inp.weight > 0;
    for (const id of ["printBtn", "imageBtn", "pdfBtn", "shareBtn"]) $(id).disabled = !ready;
    const detail = $("detail");
    detail.classList.remove("free");
    if (!ready) {
      $("total").textContent = "-";
      fitTotal();
      detail.textContent = "Enter the parcel weight";
      return;
    }
    const r = calculate(rates, inp);
    $("total").textContent = view.money(r.total);
    fitTotal();
    if (r.free) {
      detail.textContent = "Free shipping on this order";
      detail.classList.add("free");
    } else {
      detail.textContent = r.chargeablePer !== inp.weight
        ? `Charged as ${kgText(r.chargeablePer)} (rounded up)`
        : kgText(inp.weight);
    }
  }

  /** Snapshot of the current quote for export/share. Null when no weight entered. */
  function buildQuote() {
    const inp = input();
    if (!inp.weight) return null;
    const r = calculate(rates, inp);
    const base = rates.currency;
    const fx = view.fx();
    const baseTotal = formatMoney(r.total, base);
    const lkrTotal = fx ? formatMoney(r.total * fx.rate, "LKR") : null;
    const showLkr = view.display() === "LKR" && lkrTotal;
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return {
      brand: rates.businessName || "",
      route: ROUTE,
      id: `Q-${String(now.getFullYear()).slice(2)}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`,
      dateText: now.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }),
      weightText: kgText(inp.weight),
      chargedText: r.chargeablePer !== inp.weight ? kgText(r.chargeablePer) : "",
      zone: rates.zones.length > 1 ? r.zone.name : "",
      totalLabel,
      primary: showLkr ? lkrTotal : baseTotal,
      secondary: r.free ? "" : showLkr ? `Billed in ${base}: ${baseTotal}` : lkrTotal ? `≈ ${lkrTotal}` : "",
      free: r.free,
      fxLine: fx ? `1 ${base} = ${fx.rate.toFixed(2)} LKR (${new Date(fx.at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })})` : "",
      note: rates.quoteNote || "",
      contact: rates.contact || "",
    };
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  async function withQuote(fn) {
    const q = buildQuote();
    if (!q) return;
    try { await fn(q, Quote.drawQuote(q)); }
    catch (e) { if (e && e.name !== "AbortError") toast("Something went wrong. Please try again."); }
  }

  // Weight stepper
  const STEP = 0.5;
  const setWeight = (w) => { $("weight").value = w > 0 ? round2(w) : ""; render(); };
  $("minus").addEventListener("click", () => setWeight(Math.max(0, (Math.ceil(num($("weight").value) / STEP) - 1) * STEP)));
  $("plus").addEventListener("click", () => setWeight((Math.floor(num($("weight").value) / STEP) + 1) * STEP));
  ["weight", "zone", "orderValue"].forEach((id) => $(id).addEventListener("input", render));

  // Print / image / PDF
  $("printBtn").addEventListener("click", () => withQuote(async (q, canvas) => {
    const img = $("printImg");
    img.src = canvas.toDataURL("image/png");
    await img.decode();
    window.print();
  }));
  $("imageBtn").addEventListener("click", () => withQuote(async (q, canvas) => {
    Quote.download(await Quote.toBlob(canvas, "image/png"), `${q.id}.png`);
    toast("Image saved");
  }));
  $("pdfBtn").addEventListener("click", () => withQuote(async (q, canvas) => {
    Quote.download(await Quote.toPdfBlob(canvas), `${q.id}.pdf`);
    toast("PDF saved");
  }));

  // Send
  const sheet = $("shareSheet");
  const canCopyImage = !!(navigator.clipboard && window.ClipboardItem);
  sheet.querySelector('[data-share="copyImage"]').hidden = !canCopyImage;
  sheet.querySelector('[data-share="native"]').hidden = !navigator.share;
  $("shareBtn").addEventListener("click", () => sheet.showModal());
  $("shareClose").addEventListener("click", () => sheet.close());
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });

  const open = (url) => { window.open(url, "_blank", "noopener"); };
  const SHARE = {
    whatsapp: (text) => open(`https://wa.me/?text=${encodeURIComponent(text)}`),
    viber: (text) => { location.href = `viber://forward?text=${encodeURIComponent(text)}`; },
    sms: (text) => { location.href = `sms:?&body=${encodeURIComponent(text)}`; },
    email: (text, q) => { location.href = `mailto:?subject=${encodeURIComponent(`Shipping quote ${q.id}`)}&body=${encodeURIComponent(text)}`; },
    telegram: (text) => open(`https://t.me/share/url?url=${encodeURIComponent(pageUrl || " ")}&text=${encodeURIComponent(text)}`),
    copyText: async (text) => { await navigator.clipboard.writeText(text); toast("Quote copied. Paste it into any app."); },
    copyImage: async (text, q, canvas) => {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": Quote.toBlob(canvas, "image/png") })]);
      toast("Image copied. Paste it into any chat.");
    },
    native: async (text, q, canvas) => {
      const file = new File([await Quote.toBlob(canvas, "image/png")], `${q.id}.png`, { type: "image/png" });
      const data = navigator.canShare && navigator.canShare({ files: [file] })
        ? { files: [file], text, title: `Shipping quote ${q.id}` }
        : { text, title: `Shipping quote ${q.id}` };
      await navigator.share(data);
    },
  };
  sheet.querySelector(".share-grid").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-share]");
    if (!btn) return;
    withQuote(async (q, canvas) => {
      await SHARE[btn.dataset.share](Quote.shareText(q, pageUrl), q, canvas);
      sheet.close();
    });
  });

  window.addEventListener("resize", fitTotal);
  render();
})();
</script>
</body>
</html>
